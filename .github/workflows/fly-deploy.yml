# Auto-deploys services/api to Fly.io (app: lidh-api) on every push to main
# that touches code Fly actually builds from.
#
# Setup (one-time):
#   1. Generate a Fly deploy token:
#        fly tokens create deploy -x 999999h -a lidh-api
#   2. Add it as a GitHub repo secret named FLY_API_TOKEN
#        (Settings → Secrets and variables → Actions → New repository secret)
#
# See: docs/decisions.md and DEPLOY.md.

name: Deploy API to Fly

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".dockerignore"
      - ".github/workflows/fly-deploy.yml"

# Cancel in-flight deploys when a newer commit arrives — no point deploying
# an outdated SHA.
concurrency:
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + deploy
    runs-on: ubuntu-latest
    # ~5 min typical. 25 min ceiling leaves headroom for the retry loop below
    # (a stuck build still can't hold the queue forever).
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Retry transient failures. Fly's remote (Depot) builder occasionally
      # can't allocate in time — "Waiting for depot builder... context deadline
      # exceeded" — which has nothing to do with our image. `fly deploy` is
      # idempotent, so retrying is safe and keeps the API from falling behind
      # the dashboard on a one-off infra hiccup.
      - name: Deploy to Fly (retry transient builder timeouts)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            echo "::group::Deploy attempt ${attempt}/3"
            if flyctl deploy \
                 --config services/api/fly.toml \
                 --dockerfile services/api/Dockerfile \
                 --remote-only; then
              echo "::endgroup::"
              echo "Deploy succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Deploy attempt ${attempt}/3 failed (often a transient Depot builder allocation timeout). Retrying in 30s..."
            sleep 30
          done
          echo "::error::All 3 deploy attempts failed."
          exit 1
